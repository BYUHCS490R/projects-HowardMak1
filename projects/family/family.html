                    <p>Bluey is an inexhaustible blue heeler puppy, who lives with her mum, dad and little sister Bingo. She likes to laugh and have fun but more than anything else she loves to play games with her family.</p>

                </figure>
            </div>

                    <img src="mom.png" alt="Court">

</p>
