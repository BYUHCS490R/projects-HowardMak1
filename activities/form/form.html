<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forms</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <header>
        <h1>Howard Web</h1>
    </header>
    <main>
        <form action="formpro.html" method="get" id="myform">
            <fieldset>
                <legend>Form</legend>
            <div class="form-row">
                <label for="fname">Name:</label>
                <input type="text" name="fullname" id="fname" placeholder="Full Name">
            </div>
            <div class="form-row">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="name@gmail.com">
            </div>
            <div class="form-row">
                <label for="pass">Password:</label>
                <input type="password" name="password" id="pass" placeholder="********">
            </div>
            <div class="form-row">
                <label for="age">Age:</label>
                <input type="number" name="age" id="age">
            </div>
            <div class="check-row">
                <div class="spacer"></div>
                <label for="Gender">Gender:</label>
                <label><input type="radio" name="gender" value="male">Male</label>
                <label><input type="radio" name="gender" value="female">Female</label>
            </div>
            <div class="check-row">
                <div class="spacer"></div>
                <label><input type="checkbox" name="remember" value="male" checked>Remeber this device?</label>
            </div>
            <div class="form-row">
                <label for="state">State</label>
                <select name="state" id="state">
                    <option value="blank">-</option>
                    <option value="CA">California</option>
                    <option value="HI" selected>Hawaii</option>
                    <option value="UT">Utah</option>
                </select>
            </div>
            <div class="form-row">
                <label for="comments">Comments</label>
                <textarea name="comments" id="comments">-</textarea>
            </div>
            <div class="form-row">
                <div class="spacer"></div>
                <input type="submit" value="Sign Up">
            </div>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Howard Mak</p>
    </footer>
    <script>
        document.getElementById('myform').addEventListener('submit',function(event) {
            event.preventDefault();

            const fullname = document.getElementById('fname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;
            const age = document.getElementById('age').value;

            if (!fullname || !email) {
                alert("you need a name and emaill");
                return;
            }

            if (!age || age <18) {
                alert("you need to be 18");
                return;
            }

            const formdata = {
                name: fullname,
                email: email,
                password: password,
                age: age
            };

            console.log(formdata);
        });
    </script>
</body>
</html>
